name: Import GtoPdb peptide catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/import_gtopdb_peptides.py
      - .github/workflows/import_gtopdb_peptides.yml

permissions:
  contents: write

jobs:
  import_catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import current GtoPdb peptide catalog
        run: python tools/import_gtopdb_peptides.py

      - name: Validate generated catalog
        run: python tools/validate_catalog.py data/peptides.jsonl

      - name: Commit generated catalog
        run: |
          if git diff --quiet -- data/peptides.jsonl data/catalog_metadata.json; then
            echo "Catalog already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/peptides.jsonl data/catalog_metadata.json
          git commit -m "Import current GtoPdb peptide catalog"
          git push
