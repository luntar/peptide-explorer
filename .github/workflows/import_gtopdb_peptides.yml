# Fetches the authoritative GtoPdb peptide export and regenerates the JSONL catalog.
name: Import GtoPdb peptide catalog

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - tools/import_gtopdb_peptides.py
      - tools/validate_catalog.py
      - tools/summarize_catalog.py
      - .github/workflows/import_gtopdb_peptides.yml
      - data/catalog_import_trigger.txt

permissions:
  contents: write

jobs:
  import_catalog:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import current GtoPdb peptide catalog
        run: python tools/import_gtopdb_peptides.py

      - name: Validate generated catalog
        run: python tools/validate_catalog.py data/peptides.jsonl

      - name: Verify record count and generate summary
        run: python tools/summarize_catalog.py

      - name: Commit generated catalog
        run: |
          if git diff --quiet -- data/peptides.jsonl data/catalog_metadata.json data/catalog_summary.json; then
            echo "Catalog already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/peptides.jsonl data/catalog_metadata.json data/catalog_summary.json
          git commit -m "Import current GtoPdb peptide catalog"
          git push origin "HEAD:${TARGET_BRANCH}"
